<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Treno delle Frasi – Analisi logica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#07141c;--bg1:#0d2633;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.085);--line:rgba(255,255,255,.13);
  --tx:#e9f2f4;--mut:#9db3bb;--acc:#f2994a;--acc-d:#c96a26;--acc2:#2dd4bf;--pet:#0e7c86;--hl:#ffe98a;
  --tile:#fbf8f1;--tileTx:#16242b;--tileEdge:#cbbd9d;
  --P:#ef5b5b;--S:#4f9dff;--CO:#2fbf71;--IND:#a77bf3;--ATTR:#f0b429;--APP:#e0864a;
  --fs:17px;--lh:1.55;--ls:0;--ws:0;
  --ui:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;--txt:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
body.light{--bg0:#e6f0f2;--bg1:#f6fafb;--panel:#ffffff;--panel2:#f1f6f7;--line:#cfdee2;--tx:#13232b;--mut:#4d6570;--tileEdge:#d8cdb4}
body.contrast{--bg0:#000;--bg1:#000;--panel:#000;--panel2:#111;--line:#fff;--tx:#fff;--mut:#fff;--acc:#ffd400;--acc-d:#b39500;--acc2:#ffd400;--tile:#fff;--tileTx:#000;--tileEdge:#000}
body.big{--fs:20px}
body.spacing{--lh:1.9;--ls:.05em;--ws:.16em}
body.caps #app,body.caps .modal-box{text-transform:uppercase}
body.reduce *{animation:none!important;transition:none!important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#07141c}
html:has(body.light){background:#e6f0f2}
html:has(body.contrast){background:#000}
html{font-size:var(--fs)}
body{margin:0;min-height:100vh;font-family:var(--txt);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--tx);
  background:radial-gradient(1100px 520px at 85% -8%,rgba(45,212,191,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(242,153,74,.10),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 70%) fixed}
body:not(.light):not(.contrast)::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 32% 8%,#fff6,transparent),radial-gradient(1.4px 1.4px at 58% 14%,#fff9,transparent),radial-gradient(1px 1px at 76% 26%,#fff6,transparent),radial-gradient(1.2px 1.2px at 90% 12%,#fff8,transparent),radial-gradient(1px 1px at 45% 30%,#fff5,transparent),radial-gradient(1px 1px at 22% 36%,#fff4,transparent)}
.skyline{position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0;opacity:.55}
body.light .skyline,body.contrast .skyline{display:none}
h1,h2,h3,button,.ui{font-family:var(--ui)}
button{font-size:1rem;cursor:pointer;color:inherit}
mark{background:var(--hl);color:#16242b;padding:0 .2em;border-radius:4px;font-weight:700}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- HUD ---------- */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;
  background:rgba(7,20,28,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body.light header{background:rgba(255,255,255,.85)}
body.contrast header{background:#000}
.logo{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0;background:none;border:none;padding:0;text-align:left}
.logo .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--acc),var(--acc-d));display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(242,153,74,.35)}
.logo .mk svg{width:26px;height:26px}
.logo b{font-family:var(--ui);font-weight:700;letter-spacing:.08em;font-size:.86rem;line-height:1.1;text-transform:uppercase}
.logo small{display:block;color:var(--mut);font-weight:400;letter-spacing:.02em;text-transform:none;font-size:.72rem}
.lvpill{font-family:var(--ui);font-weight:600;font-size:.78rem;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:.35rem .7rem;white-space:nowrap}
.lvpill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:2px;vertical-align:1px}
.lvpill i.on{background:var(--acc2)}
.km{display:flex;flex-direction:column;align-items:flex-end;min-width:118px;font-family:var(--ui)}
.km .v{font-weight:700;font-size:.95rem;white-space:nowrap}
.km .v span{color:var(--acc)}
.km .r{font-size:.7rem;color:var(--mut);white-space:nowrap}
.km .bar{width:118px;height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:2px}
.km .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s}
.km.bump .v{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex:none}
.ibtn:hover{border-color:var(--acc2)}
@media(max-width:720px){.logo small,.lvpill{display:none}.km{min-width:0}.km .bar{width:80px}}
@media(max-width:430px){.logo b{display:none}}

#app{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:1.1rem 1rem 9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.2rem 1.3rem;backdrop-filter:blur(6px);margin-bottom:1rem}
body.light .panel{box-shadow:0 6px 20px rgba(20,60,70,.08)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.center{text-align:center}
.mut{color:var(--mut)}
.eyebrow{font-family:var(--ui);font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2)}
.btn{border:none;border-radius:14px;padding:.8rem 1.35rem;font-weight:600;font-size:1.02rem;min-height:50px;display:inline-flex;align-items:center;gap:.5rem;justify-content:center;
  background:linear-gradient(180deg,#f7a65c,var(--acc) 50%,var(--acc-d));color:#1a1206;box-shadow:0 6px 18px rgba(242,153,74,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(2px)}
.btn.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.teal{background:linear-gradient(180deg,#46e3cf,var(--acc2) 50%,#169f8f);color:#04201c;box-shadow:0 6px 18px rgba(45,212,191,.25)}
.btn.lg{font-size:1.2rem;padding:1rem 2rem;min-height:58px}
.btn.sm{min-height:42px;padding:.45rem .9rem;font-size:.92rem}
.chip{display:inline-block;font-family:var(--ui);font-weight:700;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;padding:.12rem .42rem;border-radius:5px;color:#0b1620;background:var(--c,#999);white-space:nowrap;line-height:1.35}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:1.2rem;align-items:center;margin:.6rem 0 1.2rem}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,5.6vw,3.6rem);line-height:1.02;margin:.35rem 0 .6rem;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
body.contrast .hero h1 em{color:var(--acc);background:none}
.hero p.lead{color:var(--mut);font-size:1.05rem;max-width:34ch}
.board{background:#0b1013;border:1px solid #263038;border-radius:16px;padding:.8rem .9rem;box-shadow:inset 0 2px 14px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.3);color:#ffd166;font-family:var(--mono);overflow:hidden}
.board .bh{display:flex;justify-content:space-between;font-family:var(--ui);font-size:.72rem;letter-spacing:.18em;color:#f3f3f3;opacity:.85;margin-bottom:.5rem}
.board .bh .clk{color:#ffd166;font-family:var(--mono);letter-spacing:.08em}
.brow{display:grid;grid-template-columns:3.4em 1fr 2.2em 5.6em;gap:.5em;align-items:center;padding:.32rem .2rem;border-top:1px solid #1d262c;font-size:.86rem;cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;color:inherit;text-align:left;width:100%;font-family:var(--mono)}
.brow:hover{background:#121a1f}
.brow .st{font-size:.72rem;color:#7ee0c6;text-align:right}
.brow .st.done{color:#9aa7ad}
.fl{display:inline-block;min-width:.66em;text-align:center;background:#161d22;margin-right:1px;border-radius:2px;position:relative}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#06090b}
.setup{display:grid;grid-template-columns:1fr 1.4fr;gap:1.2rem}
@media(max-width:820px){.setup{grid-template-columns:1fr}}
label.lab{font-family:var(--ui);font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:.4rem}
input[type=text]{font:inherit;font-size:1.1rem;padding:.75rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);width:100%}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media(max-width:560px){.lvls{grid-template-columns:1fr}}
.lvl{text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:.75rem .85rem;min-height:110px;transition:transform .15s}
.lvl:hover{transform:translateY(-2px)}
.lvl[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 4px rgba(242,153,74,.18)}
.lvl b{font-family:var(--ui);font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.lvl small{display:block;color:var(--mut);font-size:.82rem;line-height:1.35;margin-top:.3rem}
.dots3{display:inline-flex;gap:3px}.dots3 i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots3 i.on{background:var(--acc2)}

/* ---------- mappa (linea metro) ---------- */
.mapgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:1.2rem}
@media(max-width:860px){.mapgrid{grid-template-columns:1fr}}
.line{position:relative;padding-left:58px}
.line::before{content:"";position:absolute;left:23px;top:22px;bottom:22px;width:8px;border-radius:6px;background:linear-gradient(180deg,var(--acc2),var(--IND) 55%,var(--acc))}
.stop{position:relative;display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;margin:.65rem 0;transition:transform .15s,border-color .15s}
.stop:hover{transform:translateX(4px);border-color:var(--acc2)}
.stop .node{position:absolute;left:-49px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--bg0);border:4px solid var(--acc2);display:grid;place-items:center;font-family:var(--ui);font-weight:700;font-size:.9rem}
body.light .stop .node{background:#fff}
.stop.done .node{background:var(--acc2);color:#04201c}
.stop.next .node{box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 0 0 14px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
.stop .t{flex:1;min-width:0}
.stop .t b{font-family:var(--ui);font-size:1.08rem;display:block}
.stop .t small{color:var(--mut)}
.stop .meds{display:flex;gap:.3rem}
.med{font-family:var(--ui);font-size:.66rem;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:.15rem .35rem;color:var(--mut);text-align:center;line-height:1.2;min-width:2.3rem}
.med.cur{border-color:var(--acc);color:var(--tx)}
.med .s{display:block;letter-spacing:-.05em;color:var(--hl);font-size:.7rem}
.stop.special{border-style:dashed}
.side .panel h3{margin:.1rem 0 .4rem}
.rankcard{display:flex;gap:1rem;align-items:center}
.badge{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--acc2),#138a7d);color:#04201c;flex:none;font-family:var(--ui);font-weight:800;font-size:1.4rem}

/* ---------- briefing ---------- */
.brief{display:grid;grid-template-columns:1.15fr 1fr;gap:1.3rem;align-items:center}
@media(max-width:820px){.brief{grid-template-columns:1fr}}
.brief h2{font-size:1.65rem;margin:.25rem 0 .6rem;line-height:1.15}
.brief p{margin:.35rem 0}
.illu{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:.4rem;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.trick{display:flex;gap:.6rem;align-items:flex-start;border:1px dashed var(--acc);background:rgba(242,153,74,.08);border-radius:14px;padding:.6rem .85rem;margin-top:.8rem}
.trick b{color:var(--acc)}
.pager{display:flex;gap:.35rem}
.pager i{width:28px;height:5px;border-radius:4px;background:var(--line)}.pager i.on{background:var(--acc)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.55rem}
.qcard{border:1px solid var(--line);border-left:5px solid var(--c);background:var(--panel2);border-radius:12px;padding:.5rem .7rem;font-size:.92rem}
.qcard .q{color:var(--c);font-weight:700;display:block}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:2.6rem;margin:.6rem 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-.1rem;width:1.9rem;height:1.9rem;border-radius:9px;background:var(--acc2);color:#04201c;font-family:var(--ui);font-weight:700;display:grid;place-items:center}

/* ---------- frasi (tessere) ---------- */
.platform{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.05));border:1px solid var(--line);border-radius:18px;padding:.9rem .6rem;margin:.8rem 0}
body.light .platform{background:#eef4f5}
.sent{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:flex-start}
.tile{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:.25rem;font-family:var(--txt);font-size:1.38rem;line-height:1.25;
  padding:.5rem .8rem .55rem;border-radius:12px;border:none;background:var(--tile);color:var(--tileTx);box-shadow:0 4px 0 var(--tileEdge),0 8px 18px rgba(0,0,0,.18);min-height:54px;justify-content:center;transition:transform .12s,box-shadow .12s}
button.tile:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--tileEdge),0 12px 22px rgba(0,0,0,.22)}
button.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--tileEdge)}
.tile.plain{background:none;box-shadow:none;color:var(--tx);padding:.5rem .15rem}
.tile.ghost{background:transparent;color:var(--mut);border:2px dashed var(--mut);box-shadow:none;font-style:italic}
.tile.role{box-shadow:0 4px 0 var(--c),0 8px 18px rgba(0,0,0,.18);outline:3px solid var(--c);outline-offset:-3px}
.tile.target{outline:3px solid var(--acc);outline-offset:2px;animation:glow 1.6s infinite}
@keyframes glow{50%{outline-color:#ffd166;box-shadow:0 4px 0 var(--tileEdge),0 0 26px rgba(242,153,74,.6)}}
.tile.sel{transform:translateY(-6px);outline:3px solid var(--acc2);outline-offset:2px}
.tile.wrong{animation:shake .4s}
.tile.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gancio{background:var(--hl);border-bottom:3px solid var(--acc);border-radius:3px;padding:0 .1em}
.tile.ghost .gancio{background:none}
.ex{margin:.5rem 0}
.ex .tile{font-size:1.08rem;min-height:44px;padding:.35rem .6rem}
.ex .tile.plain{padding:.35rem .1rem}

/* ---------- gioco ---------- */
.gbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.gbar .ttl{font-family:var(--ui);font-weight:600}
.prog{flex:1;display:flex;gap:4px;min-width:140px}
.prog i{flex:1;height:8px;border-radius:5px;background:var(--line)}
.prog i.ok{background:var(--CO)}.prog i.ko{background:var(--acc)}.prog i.cur{background:var(--hl)}
.combo{font-family:var(--ui);font-weight:700;color:var(--acc);display:flex;align-items:center;gap:.2rem;min-width:3.2rem}
.combo.off{color:var(--mut);opacity:.6}
.combo.pop{animation:bump .45s}
.qhead{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.prompt{font-family:var(--ui);font-weight:600;font-size:1.38rem;text-align:center;line-height:1.25}
.rbtn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:.4rem .75rem;display:inline-flex;align-items:center;gap:.35rem;font-family:var(--ui);font-weight:600;font-size:.88rem;min-height:42px}
.rbtn:hover{border-color:var(--acc2)}
.hint{max-width:660px;margin:.6rem auto 0;border:1px solid rgba(167,123,243,.5);background:rgba(167,123,243,.12);border-radius:12px;padding:.45rem .8rem;text-align:center}
.hint b{color:#cbb2ff}
body.light .hint b{color:#6b3fc4}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;border:1px solid var(--line);border-left:6px solid var(--c,var(--acc2));background:var(--panel2);border-radius:14px;padding:.7rem .85rem;min-height:64px;font-size:1.05rem;transition:transform .12s}
.opt:hover{transform:translateY(-2px);border-color:var(--c,var(--acc2))}
.opt b{font-family:var(--ui);display:block}
.opt small{color:var(--mut);display:block;font-size:.84rem;line-height:1.3}
.opt.good{background:rgba(47,191,113,.18);border-color:var(--CO)}
.opt.bad{background:rgba(242,153,74,.15);animation:shake .4s}
.spc{border:2px dashed var(--line);background:var(--panel2);border-radius:14px;padding:.6rem 1rem;font-family:var(--ui);font-weight:600;min-height:52px;display:inline-flex;align-items:center;gap:.45rem}
.spc:hover{border-color:var(--acc2)}
.spc.good{border-color:var(--CO);background:rgba(47,191,113,.18)}
.fb{min-height:3rem;text-align:center;font-family:var(--ui);font-weight:600;font-size:1.15rem;margin:.6rem 0 .2rem}
.fb.good{color:#4ade80}.fb.bad{color:var(--acc)}
body.light .fb.good{color:#14853f}
.fb .why{display:block;font-family:var(--txt);font-weight:400;font-size:1rem;color:var(--tx)}
.palette{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin:.4rem 0}
.palette button{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--panel2);border-radius:12px;padding:.45rem .7rem;min-height:52px;text-align:center}
.palette button b{font-family:var(--ui);display:block;font-size:.95rem}
.palette button small{display:block;color:var(--mut);font-size:.74rem;line-height:1.2}
.floatpts{position:fixed;z-index:80;font-family:var(--ui);font-weight:800;font-size:1.5rem;color:var(--acc);pointer-events:none;animation:rise 1.1s forwards;text-shadow:0 2px 10px rgba(0,0,0,.4)}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}

/* ---------- treno ---------- */
.track{position:relative;overflow-x:auto;overflow-y:hidden;padding:2.6rem .6rem 0;border-radius:16px}
.track.going{overflow:hidden}
.track .hills{position:absolute;left:0;right:0;bottom:16px;height:90px;opacity:.5;background-repeat:repeat-x;background-size:600px 90px;pointer-events:none}
.illu .track{zoom:.7}
body.light .track .hills{opacity:.22}
.track.going .hills{animation:hills 2.8s linear}
@keyframes hills{to{background-position:-900px 0}}
.train{position:relative;z-index:2;display:flex;align-items:flex-end;width:max-content;margin:0 auto}
.train.go{animation:depart 3s cubic-bezier(.55,0,.85,.55) forwards}
@keyframes depart{0%{transform:translateX(0)}8%{transform:translateX(-10px)}100%{transform:translateX(150vw)}}
.rails{position:relative;z-index:1;height:16px;margin:0 -.6rem;background:linear-gradient(180deg,#c3ccd0,#7a868b) 0 0/100% 4px no-repeat,repeating-linear-gradient(90deg,#4a3b2c 0 13px,transparent 13px 28px) 0 6px/100% 9px no-repeat}
.wagon{position:relative;padding-bottom:20px;animation:drop .5s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-36px);opacity:0}to{transform:none;opacity:1}}
.wbody{position:relative;min-width:116px;max-width:210px;min-height:72px;border-radius:9px 9px 4px 4px;padding:.55rem .8rem .5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;background:var(--c);

.machine{background:linear-gradient(180deg,#1b2a33,#0f1a20);border:1px solid #2c3d47;border-radius:22px;padding:1rem;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.35)}

.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}

.reel{background:#070d11;border-radius:14px;padding:.5rem;display:flex;flex-direction:column;gap:.4rem;border-top:4px solid var(--c);color:#e9f2f4}
.reel .rl{font-family:var(--ui);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}

/* ---------- sfida ---------- */
.timer{position:relative;width:64px;height:64px;flex:none}
.timer svg{transform:rotate(-90deg)}

.score{font-family:var(--ui);font-weight:800;font-size:1.6rem}
.mult{font-family:var(--ui);font-weight:700;background:var(--acc);color:#1a1206;border-radius:8px;padding:.1rem .5rem}
.durs{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}

.bigstars{display:flex;justify-content:center;gap:.5rem;margin:.4rem 0}

.stat small{color:var(--mut)}

.ticket::before,.ticket::after{content:"";position:absolute;right:139px;width:22px;height:22px;border-radius:50%;background:var(--bg0)}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}

  .ticket::before,.ticket::after{background:#fff}
}

function draw(bucket,n){
  const arr=BANK[bucket][S.level];const key=bucket+"_"+S.level;
  let seen=new Set(S.seen[key]||[]);
  if(arr.length-seen.size<n)seen=new Set();
  const avail=[];for(let i=0;i<arr.length;i++)if(!seen.has(i))avail.push(i);
  const idx=shuffle(avail).slice(0,n);idx.forEach(i=>seen.add(i));S.seen[key]=[...seen];save();
  return idx.map(i=>{const x=arr[i];const it=typeof x==="string"?{s:x}:{...x};it.p=parse(it.s);return it;});
}
function parse(str){
  const parts=str.split(" | ").map(p=>{const i=p.lastIndexOf("/");const t=p.slice(0,i);return {t,r:p.slice(i+1),ghost:t.startsWith("(")};});
  return {parts};
}
function hookWord(t){const w=t.split(" ")[0];return PREP.has(w.toLowerCase())?w:null;}
function hookify(t){const w=hookWord(t);return w?`<span class="gancio">${esc(w)}</span>`+esc(t.slice(w.length)):esc(t);}
const plainText=p=>p.parts.filter(c=>!c.ghost).map(c=>c.t).join(" ");

/* o: reveal(true|Set) labels tappable target hideGhost gancio */
function sentHTML(p,o={}){
  return `<div class="sent">`+p.parts.map((c,i)=>{
    if(c.ghost&&o.hideGhost)return "";
    const show=o.reveal===true||(o.reveal&&o.reveal.has&&o.reveal.has(i));
    let cls="tile";if(c.r==="x")cls+=" plain";if(c.ghost)cls+=" ghost";
    if(show&&c.r!=="x")cls+=" role";if(o.target===i)cls+=" target";
    const style=(show&&c.r!=="x")?` style="--c:${ROLES[c.r].c}"`:"";
    const txt=(o.gancio&&IND.includes(c.r))?hookify(c.t):esc(c.t);
    const lab=(show&&o.labels&&c.r!=="x")?`<span class="chip">${ROLES[c.r].code}</span>`:"";
    if(o.tappable&&c.r!=="x")return `<button class="${cls}"${style} data-i="${i}">${txt}${lab}</button>`;
    return `<span class="${cls}"${style}>${txt}${lab}</span>`;
  }).join("")+`</div>`;
}
function ex(str,only){const p=parse(str);const set=new Set();p.parts.forEach((c,i)=>{if(!only||only.includes(c.r))set.add(i);});
  return `<div class="ex">${sentHTML(p,{reveal:set,labels:true,gancio:true})}</div>`;}

/* treno da una frase: done = Set di indici già assegnati */
function trainFromSentence(p,done){
  const it=p.parts.map((c,i)=>({...c,i})).filter(c=>done.has(c.i));
  const Sj=it.find(c=>c.r==="S"),Pd=it.find(c=>c.r==="P"),CO=it.filter(c=>c.r==="CO"),IN=it.filter(c=>IND.includes(c.r));
  const cars=[...IN.slice().reverse().map(c=>({t:c.t,r:c.r})),...CO.map(c=>({t:c.t,r:c.r}))];
  return trainHTML(cars,Pd&&Pd.t,Sj&&Sj.t);
}

function speak(t){

    SS.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[()→+·|]/g," , ").replace(/\s+/g," "));
    u.lang="it-IT";u.rate=.92;const v=(SS.getVoices()||[]).find(v=>v.lang&&v.lang.toLowerCase().startsWith("it"));if(v)u.voice=v;SS.speak(u);
  }catch(e){}
}

function ac(){if(!S.set.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}catch(e){return null;}}
function tone(f,d,type="sine",vol=.16,when=0,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function chuff(when){const a=ac();if(!a)return;const len=a.sampleRate*.12,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  f.type="lowpass";f.frequency.value=800;g.gain.value=.22;s.buffer=buf;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+when);}
const sfx={good(){tone(660,.12,"sine",.18);tone(990,.22,"sine",.18,.1);},bad(){tone(280,.22,"triangle",.14,0,190);},click(){tone(520,.05,"square",.04);},
  whistle(){[0,.5].forEach(w=>{tone(587,.42,"sawtooth",.05,w);tone(740,.42,"sawtooth",.05,w);tone(880,.42,"sine",.07,w);});for(let i=0;i<7;i++)chuff(1+i*.2);},

function confetti(n=140){
  if(S.set.reduce)return;const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#2dd4bf","#f2994a","#ffd166","#ef5b5b","#4f9dff","#2fbf71","#a77bf3"];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:5+Math.random()*7,h:3+Math.random()*5,col:pick(cols)}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(++f<190)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();
}

     return `<button class="brow" data-s="${s.id}"><span>${time}</span><span class="flap" data-t="${s.board}"></span><span>${s.id}</span>
       <span class="st ${done?"done":""}">${done?(s.special==="end"?"ARRIVATO":"★".repeat(st)):(k===0||S.stars[lv][STATIONS[k-1].id]?"IN PARTENZA":"PROGRAMMATO")}</span></button>`;}).join("")}

function flapAll(){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ.";
  $$(".flap").forEach((el,row)=>{const tgt=el.dataset.t;el.innerHTML=[...tgt].map(()=>`<span class="fl"> </span>`).join("");
    const cells=[...el.children];
    cells.forEach((c,i)=>{let n=6+Math.floor(Math.random()*8)+row;const f=()=>{if(S.set.reduce||n--<=0){c.textContent=tgt[i]===" "?" ":tgt[i];return;}
      c.textContent=pick(chars);setTimeout(f,45);};setTimeout(f,i*25);});});
}
function startClock(){clearInterval(clockT);const f=()=>{const el=$("#clk");if(!el){clearInterval(clockT);return;}const d=new Date();el.textContent=d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});};f();clockT=setInterval(f,15000);}

/* ======================= MOTORE DI GIOCO ======================= */
let G=null;
function startGame(st){G={st,r:0,good:0,total:0,earned:0,streak:0,best:0,convoy:[]};startRound();}
function startRound(){
  const R=G.st.rounds[G.r];const lv=S.level;
  const n=R.kind==="build"?BUILD_N[lv]:(G.st.rounds.length>1?TWO_N[lv][G.r]:ROUND_N[lv]);
  G.items=draw(R.bucket,n);
  if(R.kind==="build")G.items.sort((a,b)=>a.p.parts.length-b.p.parts.length);
  G.i=0;G.res=[];renderItem();
}
function gbar(){
  if(G.sfida)return `<div class="gbar"><button class="rbtn" id="quit">${icon("back")} Esci</button>
    <div class="timer"><svg width="64" height="64"><circle cx="32" cy="32" r="27" stroke="var(--line)" stroke-width="6" fill="none"/>
    <circle id="tring" cx="32" cy="32" r="27" stroke="var(--acc2)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="${169.6*(1-G.left/G.dur)}"/></svg><b id="tleft">${G.left}</b></div>
    <div><div class="eyebrow">Sfida Express · ${LEVELS[S.level].name}</div><span class="score" id="scr">${G.score}</span> <span class="mut">punti</span></div>
    <span style="flex:1"></span><span class="mult" id="mlt">×${mult()}</span></div>`;
  return `<div class="gbar"><button class="rbtn" id="quit">${icon("back")} Mappa</button>
   <span class="ttl">${G.st.id}. ${G.st.title}${G.st.rounds.length>1?` <span class="mut">· parte ${G.r+1} di ${G.st.rounds.length}</span>`:""}</span>
   <div class="prog" aria-label="domanda ${G.i+1} di ${G.items.length}">${G.items.map((_,i)=>`<i class="${G.res[i]===true?"ok":G.res[i]===false?"ko":i===G.i?"cur":""}"></i>`).join("")}</div>
   <span class="combo ${G.streak>=2?"":"off"}" id="cmb">${icon("flame","fill")}${G.streak}</span></div>`;
}
const mult=()=>Math.min(4,1+Math.floor(G.streak/3));
function renderItem(){
  const it=G.items[G.i];const R=G.sfida?it.R:G.st.rounds[G.r];G.att=0;G.locked=false;G.R=R;
  if(R.kind==="tap")return renderTap(R,it);
  if(R.kind==="choice")return renderChoice(R,it);
  return renderBuild(R,it);
}
function shell(R,it,hintRole,inner){
  app.innerHTML=`<div class="panel">${gbar()}
    <div class="qhead"><div class="prompt">${R.prompt}</div><button class="rbtn" id="ls" aria-label="Ascolta">${icon("speaker")}</button>
     ${hintRole&&!hintsOn()?`<button class="rbtn" id="hb">${icon("bulb")} Aiuto</button>`:""}</div>
    <div id="hint">${hintRole&&hintsOn()?hintHTML(hintRole):""}</div>
    ${inner}
    <div class="fb" id="fb" role="status"></div>
    <div class="row" style="justify-content:center"><button class="btn lg" id="nx" hidden>Avanti ${icon("next")}</button></div>
    ${G.sfida||R.kind==="build"?"":`<div class="track" id="convoy" style="padding-top:2.2rem">${trainHTML(G.convoy.slice(-5),"N. "+G.st.id,S.name||"In viaggio","STAZIONE")}</div>`}
  </div>`;
  $("#quit").onclick=()=>{if(G.sfida)endSfida(true);else mapScreen();};
  const read=()=>speak(R.prompt+". "+plainText(it.p));$("#ls").onclick=read;if(S.set.autoread)read();
  if($("#hb"))$("#hb").onclick=()=>{showHint(hintRole);$("#hb").remove();};
  $("#nx").onclick=()=>{sfx.click();advance();};
}
const hintHTML=r=>`<div class="hint">${icon("bulb")} Domanda giusta: <b>${ROLES[r].q}</b></div>`;
function showHint(r){const h=$("#hint");if(h&&!h.innerHTML)h.innerHTML=hintHTML(r);}
function verdict(ok,why,el,car){
  const fb=$("#fb");
  if(G.sfida)return sfidaVerdict(ok,why,el);
  if(ok){
    const first=G.att===0,pts=first?10:5;addKm(pts,el);G.earned+=pts;G.total++;G.res[G.i]=first;
    if(first){G.good++;G.streak++;G.best=Math.max(G.best,G.streak);}else G.streak=0;
    sfx.good();fb.className="fb good";fb.innerHTML=`${pick(GOOD)} <span class="mut">+${pts} km</span>${why?`<span class="why">${why}</span>`:""}`;
    if(G.streak>0&&G.streak%3===0){addKm(5);G.earned+=5;setTimeout(()=>toast(`${icon("flame","fill")} Combo ×${G.streak}! +5 km`),250);}
    if(car){G.convoy.push(car);const cv=$("#convoy");if(cv)cv.innerHTML=trainHTML(G.convoy.slice(-5),"N. "+G.st.id,S.name||"In viaggio","STAZIONE");}
    const c=$("#cmb");if(c){c.className="combo pop"+(G.streak>=2?"":" off");c.innerHTML=icon("flame","fill")+G.streak;}
    G.locked=true;$("#nx").hidden=false;$("#nx").focus({preventScroll:true});
  }else{
    G.att++;G.streak=0;sfx.bad();const c=$("#cmb");if(c){c.className="combo off";c.innerHTML=icon("flame","fill")+"0";}
    if(G.att>=2){G.total++;G.res[G.i]=false;G.locked=true;fb.className="fb bad";
      fb.innerHTML=`Ecco la risposta giusta. Guardala con calma.${why?`<span class="why">${why}</span>`:""}`;$("#nx").hidden=false;$("#nx").focus({preventScroll:true});return "reveal";}
    fb.className="fb bad";fb.innerHTML=`Non ancora. Riprova con la domanda giusta.`;
  }
}
function advance(){
  G.i++;if(G.i<G.items.length)return renderItem();
  G.r++;if(G.r<G.st.rounds.length){toast("Seconda parte!");return startRound();}
  finishStation();
}

/* ---- tocca il pezzo giusto ---- */
function renderTap(R,it){
  const p=it.p;const idx=p.parts.findIndex(c=>c.r===R.role&&!c.ghost);
  const gIdx=p.parts.findIndex(c=>c.r===R.role&&c.ghost);
  const answer=idx>=0?idx:(gIdx>=0?"hidden":"none");
  const gancio=R.role!=="P"&&R.role!=="S"?true:S.level!=="base";
  shell(R,it,R.role,`<div class="platform" id="sent">${sentHTML(p,{tappable:true,hideGhost:R.hiddenBtn,gancio})}</div>
    <div class="row" style="justify-content:center">
     ${R.hiddenBtn?`<button class="spc" id="hid">${icon("eyeoff")} È sottinteso</button>`:""}
     ${R.noneBtn?`<button class="spc" id="none">${icon("ban")} Nessun complemento oggetto</button>`:""}</div>`);
  const reveal=()=>{if(answer==="none")return;const set=new Set([answer==="hidden"?gIdx:idx]);
    $("#sent").innerHTML=sentHTML(p,{reveal:set,labels:true,gancio});};
  const whyTxt=answer==="hidden"?`Il soggetto è sottinteso: ${p.parts[gIdx].t}.`:answer==="none"?"In questa frase non c'è il complemento oggetto.":"";
  const car=answer==="none"?null:{t:p.parts[answer==="hidden"?gIdx:idx].t,r:R.role==="P"?"P":R.role};
  const handle=(choice,btn)=>{if(G.locked)return;
    if(choice===answer){if(typeof answer==="string")btn.classList.add("good");reveal();verdict(true,whyTxt,btn,car&&car.r!=="P"?car:null);}
    else{btn.classList.remove("wrong");void btn.offsetWidth;btn.classList.add("wrong");showHint(R.role);
      if(verdict(false,whyTxt,btn)==="reveal"){reveal();if(typeof answer==="string"){const b=$(answer==="hidden"?"#hid":"#none");b&&b.classList.add("good");}}}};
  $$("#sent .tile[data-i]").forEach(b=>b.onclick=()=>handle(+b.dataset.i,b));
  if(R.hiddenBtn)$("#hid").onclick=e=>handle("hidden",e.currentTarget);
  if(R.noneBtn)$("#none").onclick=e=>handle("none",e.currentTarget);
}

/* ---- scelta sul pezzo evidenziato ---- */
function renderChoice(R,it){
  const p=it.p;const tRole=R.ind?it.t:(R.target||it.a);const ti=p.parts.findIndex(c=>c.r===tRole);
  const ans=R.ind?it.t:it.a;let opts;
  if(R.ind){
    const pool=LV_TYPES[S.level].filter(r=>r!==ans);const nOpt={base:2,inter:3,adv:4}[S.level];
    const conf=CONFUSE[ans]&&pool.includes(CONFUSE[ans])?CONFUSE[ans]:null;
    let ds=S.level==="base"?[pick(pool.filter(r=>r!==conf))]:[...(conf?[conf]:[]),...shuffle(pool.filter(r=>r!==conf))].slice(0,nOpt-1);
    opts=shuffle([ans,...ds]).map(r=>({id:r,label:ROLES[r].name,small:ROLES[r].q,c:ROLES[r].c}));
  }else opts=R.options;
  shell(R,it,R.ind?ans:null,`<div class="platform" id="sent">${sentHTML(p,{target:ti,gancio:R.ind})}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o.id}" style="--c:${o.c}"><span><b>${o.label}</b><small>${o.small}</small></span></button>`).join("")}</div>`);
  const done=()=>{const lbl=opts.find(o=>o.id===ans);
    $("#sent").innerHTML=sentHTML(p,{reveal:new Set([ti]),labels:true,gancio:R.ind});
    if(!R.ind&&R.target==="P"){const t=$("#sent .tile.role");if(t)t.querySelector(".chip").textContent=ans==="verb"?"Pred. verbale":"Pred. nominale";}
    $$(".opt").forEach(b=>{if(b.dataset.o===ans)b.classList.add("good");});return lbl;};
  const car=R.target==="P"?null:{t:p.parts[ti].t,r:tRole};
  $$(".opt").forEach(b=>b.onclick=()=>{if(G.locked)return;
    if(b.dataset.o===ans){done();verdict(true,it.why||"",b,car);}
    else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");if(R.ind)showHint(ans);
      if(verdict(false,it.why||"",b)==="reveal")done();}});
}

/* ---- componi il treno ---- */
function renderBuild(R,it){
  const p=it.p;const done=new Set();let sel=null,errs=0;const tries={};
  const present=[...new Set(p.parts.map(c=>c.r))];const order=["P","S","CO",...IND];
  let pal=present.slice();
  const extra={base:0,inter:1,adv:3}[S.level];
  const pool=shuffle(order.filter(r=>!present.includes(r)&&r!=="P"&&r!=="S"&&(LV_TYPES[S.level].includes(r)||r==="CO")));
  pal=pal.concat(pool.slice(0,extra)).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  shell(R,it,null,`<p class="center mut" style="margin:.3rem 0">1. Tocca un pezzo della frase · 2. Scegli il suo ruolo</p>
    <div class="platform" id="sent"></div><div id="pal" class="palette" aria-label="Ruoli"></div>
    <div class="track" id="tw"></div>`);
  const drawS=()=>{$("#sent").innerHTML=sentHTML(p,{tappable:true,reveal:done,labels:true,gancio:true});
    $$("#sent .tile[data-i]").forEach(b=>{const i=+b.dataset.i;if(done.has(i)){b.disabled=true;return;}if(sel===i)b.classList.add("sel");
      b.onclick=()=>{sel=i;sfx.click();drawS();showPal();};});
    $("#tw").innerHTML=trainFromSentence(p,done);};
  const showPal=()=>{
    if(sel===null){$("#pal").innerHTML=`<span class="mut">Scegli un pezzo della frase.</span>`;return;}
    $("#pal").innerHTML=pal.map(r=>`<button data-r="${r}" style="--c:${ROLES[r].c}"><b>${ROLES[r].name}</b>${hintsOn()?`<small>${ROLES[r].q}</small>`:""}</button>`).join("");
    $$("#pal button").forEach(b=>b.onclick=()=>{if(G.locked||sel===null)return;const c=p.parts[sel];
      if(b.dataset.r===c.r){done.add(sel);sel=null;tone(620+done.size*90,.12,"sine",.14);drawS();showPal();check();}
      else{errs++;tries[sel]=(tries[sel]||0)+1;sfx.bad();b.style.opacity=.45;const fb=$("#fb");fb.className="fb bad";
        if(tries[sel]>=2){fb.innerHTML=`«${esc(c.t)}» è: ${ROLES[c.r].name}. <span class="why">${ROLES[c.r].q}</span>`;done.add(sel);sel=null;drawS();showPal();check();}
        else fb.innerHTML=`Non ancora. Fai la domanda giusta a «${esc(c.t)}».`;}});};
  const check=()=>{if(done.size<p.parts.length)return;G.locked=true;$("#pal").innerHTML="";
    const ok=errs===0,pts=ok?10:5;addKm(pts,$("#tw"));G.earned+=pts;G.total++;G.res[G.i]=ok;
    if(ok){G.good++;G.streak++;G.best=Math.max(G.best,G.streak);}else G.streak=0;
    const fb=$("#fb");fb.className="fb good";fb.innerHTML=`${ok?pick(GOOD):"Treno completo!"} <span class="mut">+${pts} km</span><span class="why">Tutti a bordo: si parte!</span>`;
    speak(plainText(p));depart($("#tw"),()=>{if(!$("#nx"))return;$("#nx").hidden=false;$("#nx").focus({preventScroll:true});});};
  drawS();showPal();
}

/* ---- fine stazione ---- */
function finishStation(){
  const acc=G.total?G.good/G.total:0;const stars=acc>=.9?3:acc>=.65?2:1;const lv=S.level;
  S.stars[lv][G.st.id]=Math.max(S.stars[lv][G.st.id]||0,stars);save();sfx.fanfare();confetti();
  const nxt=STATIONS.find(s=>s.id===G.st.id+1);
  const msg=stars===3?"Viaggio perfetto.":stars===2?"Ottimo viaggio.":"Viaggio completato. Puoi ripeterlo con frasi nuove per avere più stelle.";
  app.innerHTML=`<div class="panel center"><div class="eyebrow">Stazione ${G.st.id} · ${LEVELS[lv].name}</div>
    <h2 style="font-size:2rem;margin:.3rem 0">${G.st.title}: completata</h2>
    <div class="bigstars">${[0,1,2].map(i=>starSVG(i<stars)).join("")}</div><p style="font-size:1.1rem">${msg}</p>
    <div class="stats"><div class="stat"><b>${Math.round(acc*100)}%</b><small>giuste al primo colpo</small></div>
     <div class="stat"><b>${G.earned}</b><small>km percorsi</small></div><div class="stat"><b>${G.best}</b><small>combo migliore</small></div></div>
    <div class="track" id="fin">${trainHTML(G.convoy.slice(-6),"N. "+G.st.id,S.name||"In viaggio","STAZIONE")}</div>
    <div class="row" style="justify-content:center;margin-top:1rem">
     <button class="btn sec" id="ag">${icon("refresh")} Rigioca con frasi nuove</button><button class="btn sec" id="mp">${icon("map")} Mappa</button>
     ${nxt?`<button class="btn" id="nt">${nxt.title} ${icon("next")}</button>`:""}</div></div>`;
  speak(`Stazione completata. ${stars} stelle. ${msg}`);

}

const SF_TYPES=[{kind:"tap",role:"P",bucket:"p_tap",prompt:"Tocca il predicato"},{kind:"tap",role:"S",hiddenBtn:true,bucket:"s_tap",prompt:"Tocca il soggetto"},
  {kind:"tap",role:"CO",noneBtn:true,bucket:"co_tap",prompt:"Tocca il complemento oggetto"},{kind:"choice",ind:true,bucket:"ind",prompt:"Che complemento è?"},
  STATIONS[4].rounds[0],STATIONS[0].rounds[1]];
function sfidaItem(){const R=pick(SF_TYPES);const it=draw(R.bucket,1)[0];it.R=R;return it;}
function startSfida(dur){
  G={sfida:true,st:{id:8,title:"Sfida Express",rounds:[]},dur,left:dur,score:0,streak:0,best:0,good:0,total:0,items:[sfidaItem()],i:0,res:[]};
  sfx.whistle();renderItem();clearInterval(sfT);
  sfT=setInterval(()=>{if(!G||!G.sfida){clearInterval(sfT);return;}G.left--;const t=$("#tleft"),r=$("#tring");
    if(t)t.textContent=G.left;if(r)r.setAttribute("stroke-dashoffset",169.6*(1-G.left/G.dur));if(G.left<=10&&G.left>0)sfx.tick();
    if(G.left<=0){clearInterval(sfT);endSfida();}},1000);
}
function sfidaVerdict(ok,why,el){
  if(G.locked)return;G.locked=true;G.total++;
  if(ok){const m=mult();const pts=10*m;G.score+=pts;G.good++;G.streak++;G.best=Math.max(G.best,G.streak);sfx.good();
    if(el&&!el.isConnected)el=$("#fb");
    if(el){const r=el.getBoundingClientRect();const f=document.createElement("div");f.className="floatpts";f.textContent=`+${pts}`;f.style.left=(r.left+r.width/2-20)+"px";f.style.top=(r.top-10)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1100);}
    $("#fb").className="fb good";$("#fb").innerHTML=pick(GOOD);if(mult()>m)toast(`Moltiplicatore ×${mult()}!`);}
  else{G.streak=0;sfx.bad();$("#fb").className="fb bad";$("#fb").innerHTML=`Era questa.${why?`<span class="why">${why}</span>`:""}`;}
  const s=$("#scr");if(s)s.textContent=G.score;const ml=$("#mlt");if(ml)ml.textContent="×"+mult();
  setTimeout(()=>{if(!G||!G.sfida||G.left<=0)return;G.items.push(sfidaItem());G.i++;renderItem();},ok?650:1500);
  return ok?undefined:"reveal";
}
function endSfida(quit){
  clearInterval(sfT);if(!G||!G.sfida)return mapScreen();const lv=S.level;const g=G;G=null;
  if(quit)return mapScreen();
  const rec=g.score>(S.best[lv]||0);if(rec){S.best[lv]=g.score;}
  const km=Math.round(g.score/4);S.stars[lv][8]=Math.max(S.stars[lv][8]||0,g.score>=300?3:g.score>=150?2:1);save();addKm(km);
  sfx.fanfare();if(rec)confetti(180);
  app.innerHTML=`<div class="panel center"><div class="eyebrow">Sfida Express · ${LEVELS[lv].name} · ${g.dur} secondi</div>
    <h2 style="font-size:2.2rem;margin:.3rem 0">${rec?"Nuovo record!":"Tempo scaduto!"}</h2>
    <div class="score" style="font-size:3.2rem">${g.score}</div><p class="mut">punti</p>
    <div class="stats"><div class="stat"><b>${g.good}/${g.total}</b><small>risposte giuste</small></div><div class="stat"><b>${g.best}</b><small>serie migliore</small></div>
     <div class="stat"><b>+${km}</b><small>km guadagnati</small></div></div>
    <div class="row" style="justify-content:center"><button class="btn" id="ag">${icon("refresh")} Riprova</button><button class="btn sec" id="mp">${icon("map")} Mappa</button></div></div>`;
  speak(`${rec?"Nuovo record!":"Tempo scaduto!"} ${g.score} punti.`);
  $("#ag").onclick=sfidaIntro;$("#mp").onclick=mapScreen;
}

    const keep=S.set;S=JSON.parse(JSON.stringify(DEF));S.set=keep;save();hud();homeScreen();};
}

 ["big","Testo grande",""],["caps","TUTTO MAIUSCOLO","Stampato maiuscolo in tutta l'app"],["spacing","Spazi larghi","Più spazio tra lettere, parole e righe"],
 ["light","Tema chiaro","Sfondo chiaro invece che notturno"],["contrast","Contrasto alto",""],["sound","Suoni",""],["reduce","Meno animazioni",""]];
const GLOSS=[["Predicato","La locomotiva. Dice che cosa succede. Contiene sempre un verbo."],["Predicato verbale","Un verbo che indica un'azione: il cane <b>abbaia</b>."],
 ["Predicato nominale","Essere + una parola che dice com'è o chi è: il cielo <b>è azzurro</b>."],["Soggetto","Il macchinista. Chi fa l'azione o ciò di cui si parla. Chi? Che cosa?"],
 ["Soggetto sottinteso","Non è scritto, ma si capisce dal verbo: <b>(noi)</b> mangiamo."],["Complemento oggetto","Il primo vagone. Riceve l'azione. Non ha la preposizione."],
 ["Preposizione","Il gancio: di, a, da, in, con, su, per, tra, fra (anche del, alla, nel…)."],["Complemento indiretto","Un vagone con il gancio. Ognuno risponde a una domanda."],
 ["Tempo continuato","Per quanto tempo? Studio <b>per due ore</b>."],["Fine o scopo","Per quale scopo? Studio <b>per la verifica</b>."],["Argomento","Di che cosa si parla? Parliamo <b>di musica</b>."],
 ["Materia","Di che materiale? Una capanna <b>di legno</b>."],["Attributo","Un aggettivo vicino a un nome: dice com'è."],["Apposizione","Un nome vicino a un altro nome: dice chi è o che cos'è."]];
function renderSettings(){
  $("#setList").innerHTML=`<div class="tg"><span><b>Livello</b><small>${LEVELS[S.level].desc}</small></span><span class="row">${Object.entries(LEVELS).map(([k,L])=>`<button class="btn sm ${k===S.level?"":"sec"}" data-lv="${k}">${L.name}</button>`).join("")}</span></div>`+
   SETS.map(([k,l,d])=>`<div class="tg"><span><b>${l}</b>${d?`<small>${d}</small>`:""}</span><button class="sw" role="switch" aria-checked="${!!S.set[k]}" aria-label="${l}" data-k="${k}"></button></div>`).join("");
  $$("#setList .sw").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.set[k]=!S.set[k];save();applySettings();b.setAttribute("aria-checked",S.set[k]);sfx.click();});
  $$("#setList [data-lv]").forEach(b=>b.onclick=()=>{S.level=b.dataset.lv;save();hud();renderSettings();});
}
function openModal(id){$(id).classList.add("open");const b=$(id).querySelector("button");b&&b.focus();}
$$(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))m.classList.remove("open");}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$$(".modal.open").forEach(m=>m.classList.remove("open"));});
$("#bSet").onclick=()=>{renderSettings();openModal("#mSet");};
$("#bGl").onclick=()=>{$("#glB").innerHTML=GLOSS.map(([t,d])=>`<dt><mark>${t}</mark></dt><dd>${d}</dd>`).join("");openModal("#mGl");};
$("#glL").onclick=()=>speak($("#glB").innerText);
$("#bMap").onclick=()=>{if(G&&G.sfida){endSfida(true);return;}sfx.click();mapScreen();};
$("#logo").onclick=()=>{if(G&&G.sfida){clearInterval(sfT);G=null;}homeScreen();};
window.addEventListener("error",e=>{try{console.warn(e.message);toast("Piccolo intoppo. Torna alla mappa e riprova.");}catch(_){}});

applySettings();hud();
$("#bMap").innerHTML=icon("map");$("#bGl").innerHTML=icon("book");$("#bSet").innerHTML=icon("sliders");
try{if(window.speechSynthesis){window.speechSynthesis.getVoices();}}catch(e){}
homeScreen();
